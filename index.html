<!DOCTYPE html>
<html lang="en" ng-app="MovieBooking">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Seat Booking</title>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
    <script src="js/app.js"></script>

    <link rel="stylesheet" href="css/style.css">
</head>

<body ng-controller="bookingController">

    <!-- Navbar -->
    <nav>
        <h2>{{appName}}</h2>

        <ul>
            <li>Home</li>
            <li>Movies</li>
            <li>Seats</li>
            <li>Booking</li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <section class="hero">

        <h1>{{welcomeMessage}}</h1>

        <p>{{description}}</p>

    </section>

    <!-- Dashboard -->
    <section class="dashboard" ng-init="cardColor='#1f1f1f'">

        <h2>Dashboard</h2>

        <div class="card-container">

            <div class="card"
                 ng-repeat="item in dashboard"
                 ng-class="{'highlight': item.title=='Ticket Price'}"
                 ng-style="{'background':cardColor}">

                <h3>{{item.title}}</h3>

                <p>{{item.value}}</p>

            </div>

        </div>

    </section>

</body>

</html>
