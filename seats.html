<!DOCTYPE html>
<html ng-app="MovieBooking">

<head>

<meta charset="UTF-8">

<title>Seat Selection</title>

<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>

<script src="js/app.js"></script>

<link rel="stylesheet" href="css/style.css">

</head>

<body ng-controller="bookingController">

<nav>

<h2>{{appName}}</h2>

<ul>

<li><a href="index.html">Home</a></li>

<li><a href="movies.html">Movies</a></li>

<li>Seats</li>

</ul>

</nav>

<h1 class="page-title">

Select Your Seats

</h1>

<div class="legend">

<div><span class="seat available"></span> Available</div>

<div><span class="seat reserved"></span> Reserved</div>

<div><span class="seat selected"></span> Selected</div>

</div>

<div class="seat-grid">

<button
class="seat"

ng-repeat="seat in seats"

ng-class="{

'available':seat.status=='available',

'reserved':seat.status=='reserved',

'selected':seat.selected

}"

ng-click="toggleSeat(seat)"

ng-disabled="seat.status=='reserved'">

{{seat.number}}

</button>

</div>

<h2 class="selected-seat-text">

Selected Seats :

{{selectedSeats.join(', ')}}

</h2>

<br>

<a href="booking.html">

<button class="continue-btn">

Continue Booking

</button>

</a>

</body>

</html>
